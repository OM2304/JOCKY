[package]
name = "jocky-rs"
version = "0.1.0"
edition = "2021"
description = "Native (Rust) VM for JOCKY bytecode images (SIH26148, NTRO)"
license = "MIT"

# Deliberately dependency-free (stdlib only) so the project builds offline.
[profile.release]
opt-level = 3

[lib]
path = "src/lib.rs"

[[bin]]
name = "jocky-rs"
path = "src/main.rs"
